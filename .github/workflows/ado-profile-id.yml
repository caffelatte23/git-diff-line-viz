name: ADO profile id (throwaway)

# Run this once via the Actions tab, copy the "id" from the output, add it as a
# member of the Marketplace publisher, then delete this file.

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Azure DevOps profile
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
