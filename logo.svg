<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Git branch diff logo</title>
  <desc id="desc">A stylized Git branch with green additions and red deletions, representing differences from a target branch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263A66"/>
      <stop offset="1" stop-color="#17233F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1020" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#4A6FAF" stroke-opacity=".45" stroke-width="4"/>

  <!-- Branch graph -->
  <g fill="none" stroke="#EAF2FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M148 118v244"/>
    <path d="M148 238c0-67 53-120 120-120h18"/>
    <path d="M148 238c0 67 53 120 120 120h18"/>
  </g>

  <!-- Commit nodes -->
  <g fill="#EAF2FF" stroke="#263A66" stroke-width="12">
    <circle cx="148" cy="118" r="30"/>
    <circle cx="148" cy="238" r="30"/>
    <circle cx="148" cy="394" r="30"/>
    <circle cx="286" cy="118" r="30"/>
    <circle cx="286" cy="358" r="30"/>
  </g>

  <!-- Diff cards -->
  <g filter="url(#shadow)">
    <rect x="312" y="56" width="124" height="124" rx="26" fill="#193F36" stroke="#4FE09A" stroke-width="5"/>
    <rect x="312" y="296" width="124" height="124" rx="26" fill="#4B2732" stroke="#FF7085" stroke-width="5"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="14">
    <path d="M342 118h64M374 86v64" stroke="#4FE09A"/>
    <path d="M342 358h64" stroke="#FF7085"/>
  </g>

  <!-- Small target-branch marker -->
  <circle cx="148" cy="238" r="10" fill="#5CC8FF"/>
</svg>
